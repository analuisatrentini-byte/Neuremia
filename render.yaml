services:
  - type: web
    name: neuremia-api
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /health
    envVars:
      - key: NEUREMIA_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neuremia-db
          property: connectionString
      - key: NEUREMIA_SECRET_KEY
        generateValue: true
      - key: NEUREMIA_FIELD_ENCRYPTION_KEY
        sync: false
      - key: NEUREMIA_ADMIN_API_KEY
        generateValue: true
      - key: NEUREMIA_ALLOWED_ORIGINS
        value: '*'
      - key: NEUREMIA_ALLOWED_HOSTS
        value: '*'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '30'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '30'
      - key: BACKUP_SCHEDULE
        value: managed-by-render
      - key: LOG_LEVEL
        value: info

databases:
  - name: neuremia-db
    databaseName: neuremia
    user: neuremia
    plan: free
