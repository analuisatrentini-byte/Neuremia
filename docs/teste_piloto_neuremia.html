<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Neuremia — Teste Piloto (12 participantes)</title>
<meta name="viewport" content="width=1280" />
<style>
  :root{
    --yellow:#FFD93D;
    --gold:#FFA800;
    --orange:#FF7A00;
    --ink:#1a1a1f;
    --ink-soft:#4a4a55;
    --paper:#ffffff;
    --cream:#FFF9EC;
    --border:#E9E4D5;
    --ok:#3BA55C;
    --warn:#FFA800;
    --bad:#E24C4C;
    --grid:#F1EEE3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#2a2a30;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  .deck{max-width:100%;margin:0 auto;padding:24px 0}
  .slide{
    width:1180px;height:720px;
    margin:22px auto;
    background:var(--paper);
    border-radius:22px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    padding:56px 64px;
    position:relative;
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;height:6px;width:100%;
    background:linear-gradient(90deg,var(--yellow),var(--gold),var(--orange));
  }
  .brand{
    position:absolute;bottom:22px;right:32px;
    font-size:12px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase
  }
  .pagenum{
    position:absolute;bottom:22px;left:32px;
    font-size:12px;color:var(--ink-soft);letter-spacing:.08em
  }
  .kicker{
    display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--orange);font-weight:700;margin-bottom:14px
  }
  h1{font-size:56px;line-height:1.05;margin:0 0 14px 0;letter-spacing:-.02em}
  h2{font-size:36px;line-height:1.1;margin:0 0 18px 0;letter-spacing:-.01em}
  h3{font-size:20px;margin:0 0 10px 0}
  p,li{font-size:16px;line-height:1.5;color:var(--ink-soft)}
  .lead{font-size:20px;line-height:1.5;color:var(--ink)}
  .grid{display:grid;gap:16px}
  .col-2{grid-template-columns:1fr 1fr}
  .col-3{grid-template-columns:1fr 1fr 1fr}
  .col-4{grid-template-columns:1fr 1fr 1fr 1fr}
  .card{
    background:var(--cream);border:1px solid var(--border);border-radius:14px;padding:16px 18px
  }
  .card.tight{padding:12px 14px}
  .card h3{font-size:16px;color:var(--ink);margin-bottom:6px}
  .card .meta{font-size:12px;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
  .card p{font-size:13px;line-height:1.4;margin:4px 0}
  .stat{
    background:linear-gradient(135deg,var(--yellow) 0%,var(--gold) 100%);
    color:var(--ink);border-radius:14px;padding:18px 20px
  }
  .stat .num{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .stat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-top:6px;color:#3a2a00}
  .pill{
    display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;

  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;color:var(--ink)}

  .cover .logo{
    width:60px;height:60px;border-radius:14px;
    background:linear-gradient(135deg,var(--yellow),var(--orange));
    box-shadow:0 6px 18px rgba(255,122,0,.35);
    display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:24px

  .heat .hdr{font-size:11px;color:var(--ink-soft);text-align:center;font-weight:600}
  .heat .row-lbl{font-size:12px;color:var(--ink);padding-right:6px;font-weight:600}

  svg.chart{width:100%;height:100%}
  .axis{stroke:#d9d3c1;stroke-width:1}
  .gridline{stroke:#efece0;stroke-width:1}
  .label{fill:#4a4a55;font-size:10px}
  .series{fill:none;stroke-width:2}
  .dot{stroke-width:0}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;color:var(--ink-soft);margin-top:8px}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .nav{

    background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
    padding:8px 14px;border-radius:999px;display:flex;gap:8px;align-items:center;z-index:99;color:#fff;font-size:12px

    background:#ffffff;border:0;padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;font-weight:600

  @media print{
    body{background:#fff}
    .deck{padding:0}
    .slide{margin:0;box-shadow:none;border-radius:0;page-break-after:always;width:100%;height:100vh}
    .nav{display:none}
  }
  .split{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;min-height:0}
  .chartbox{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column}
  .chartbox h3{font-size:14px;margin:0 0 6px 0}
  .chartbox .sub{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
  .chart-wrap{flex:1;min-height:0}
  ul.clean{padding-left:18px;margin:6px 0}
  ul.clean li{margin:4px 0}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .mini{font-size:11px}
  .divider{height:1px;background:var(--border);margin:10px 0}
</style>
</head>

<script>
/* ---------- Dados do piloto (7 dias, mín. 3 check-ins por participante) ---------- */

const dayLabels = Array.from({length:DAYS},(_,i)=>`D${i+1}`);

/* 12 participantes anonimizados.

/* ---------- helpers ---------- */
const COLORS = ["#FFA800","#FF7A00","#E24C4C","#3BA55C","#274a86","#7B4BFF","#c86dd7","#00B3A6","#8a5a00","#5A6472","#D64161","#2E7D32"];
const fmtBR = (n,d=1)=> (n===null||n===undefined||isNaN(n))?"—":Number(n).toFixed(d).replace(".",",");
const avg = a => { const v=a.filter(x=>x!==null&&x!==undefined); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; };

function lineChart({series, ymin, ymax, w=520, h=240, ticks=5}){
  const pad = {l:34,r:12,t:10,b:22};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const x = i => pad.l + (i/(DAYS-1))*iw;
  const y = v => pad.t + ih - ((v-ymin)/(ymax-ymin))*ih;
  let g = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let t=0;t<=ticks;t++){
    const gy = pad.t + (t/ticks)*ih;
    const gv = ymax - (t/ticks)*(ymax-ymin);
    g += `<line class="gridline" x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}"/>`;
    g += `<text class="label" x="${pad.l-6}" y="${gy+3}" text-anchor="end">${fmtBR(gv,1)}</text>`;
  }
  for(let i=0;i<DAYS;i++){
    g += `<text class="label" x="${x(i)}" y="${h-6}" text-anchor="middle">D${i+1}</text>`;
  }
  g += `<line class="axis" x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}"/>`;
  series.forEach((s,si)=>{
    const c = s.color || COLORS[si%COLORS.length];
    let d="";let first=true;
    s.values.forEach((v,i)=>{
      if(v===null||v===undefined) return;
      d += (first?"M":"L") + x(i).toFixed(1) + "," + y(v).toFixed(1) + " ";
      first=false;
    });
    g += `<path class="series" d="${d}" stroke="${c}" opacity="${s.opacity||0.9}"/>`;
    s.values.forEach((v,i)=>{
      if(v===null||v===undefined) return;
      g += `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${c}"/>`;
    });
  });
  g += `</svg>`;
  return g;
}

function barChart({items, w=520, h=240, ymax=null, colorFn=null, valueFmt=null}){
  const pad={l:30,r:12,t:14,b:40};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const ym = ymax ?? Math.max(...items.map(i=>i.v))*1.15;
  const bw = iw/items.length*0.7;
  const step = iw/items.length;
  let g = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let t=0;t<=4;t++){
    const gy=pad.t+(t/4)*ih;
    const gv=ym-(t/4)*ym;
    g+=`<line class="gridline" x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}"/>`;
    g+=`<text class="label" x="${pad.l-6}" y="${gy+3}" text-anchor="end">${fmtBR(gv,0)}</text>`;
  }
  items.forEach((it,i)=>{
    const bx = pad.l + i*step + (step-bw)/2;
    const bh = (it.v/ym)*ih;
    const by = pad.t + ih - bh;
    const c = colorFn ? colorFn(it,i) : (it.color || COLORS[i%COLORS.length]);
    g+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${c}"/>`;
    g+=`<text class="label" x="${(bx+bw/2).toFixed(1)}" y="${(by-4).toFixed(1)}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#1a1a1f">${valueFmt?valueFmt(it.v):it.v}</text>`;
    g+=`<text class="label" x="${(bx+bw/2).toFixed(1)}" y="${h-22}" text-anchor="middle">${it.k}</text>`;
    if(it.k2) g+=`<text class="label" x="${(bx+bw/2).toFixed(1)}" y="${h-10}" text-anchor="middle" style="opacity:.7">${it.k2}</text>`;
  });
  g+=`</svg>`;
  return g;
}

function prePostChart({items, w=520, h=260, ymax=27, threshold=null, thresholdLabel=""}){
  const pad={l:32,r:12,t:16,b:34};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const step = iw/items.length;
  const bw = step*0.34;
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let t=0;t<=4;t++){
    const gy=pad.t+(t/4)*ih;
    const gv=ymax-(t/4)*ymax;
    g+=`<line class="gridline" x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}"/>`;
    g+=`<text class="label" x="${pad.l-6}" y="${gy+3}" text-anchor="end">${gv.toFixed(0)}</text>`;
  }
  if(threshold!==null){
    const ty = pad.t + ih - (threshold/ymax)*ih;
    g+=`<line x1="${pad.l}" y1="${ty}" x2="${w-pad.r}" y2="${ty}" stroke="#E24C4C" stroke-dasharray="4 4" stroke-width="1"/>`;
    g+=`<text x="${w-pad.r-4}" y="${ty-4}" text-anchor="end" style="font-size:10px;fill:#E24C4C">${thresholdLabel}</text>`;
  }
  items.forEach((it,i)=>{
    const cx = pad.l + i*step + step/2;
    const preX = cx - bw - 2;
    const posX = cx + 2;
    const preH = (it.pre/ymax)*ih;
    const posH = (it.pos/ymax)*ih;
    g+=`<rect x="${preX.toFixed(1)}" y="${(pad.t+ih-preH).toFixed(1)}" width="${bw.toFixed(1)}" height="${preH.toFixed(1)}" rx="3" fill="#FFD93D"/>`;
    g+=`<rect x="${posX.toFixed(1)}" y="${(pad.t+ih-posH).toFixed(1)}" width="${bw.toFixed(1)}" height="${posH.toFixed(1)}" rx="3" fill="#FF7A00"/>`;
    g+=`<text class="label" x="${(preX+bw/2).toFixed(1)}" y="${(pad.t+ih-preH-3).toFixed(1)}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#1a1a1f">${it.pre}</text>`;
    g+=`<text class="label" x="${(posX+bw/2).toFixed(1)}" y="${(pad.t+ih-posH-3).toFixed(1)}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#1a1a1f">${it.pos}</text>`;
    g+=`<text class="label" x="${cx.toFixed(1)}" y="${h-10}" text-anchor="middle">${it.k}</text>`;
  });
  g+=`</svg>`;
  return g;
}

/* 1. Capa */

/* ---------- render + nav ---------- */
document.getElementById("deck").innerHTML = slides.join("");
document.getElementById("tot").textContent = slides.length;
let cur = 0;
function go(dir){
  cur = Math.max(0, Math.min(slides.length-1, cur+dir));
  const el = document.querySelectorAll(".slide")[cur];
  el.scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("cur").textContent = cur+1;
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") { e.preventDefault(); go(1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp") { e.preventDefault(); go(-1); }
});
const io = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      const idx = Array.from(document.querySelectorAll(".slide")).indexOf(en.target);
      if(idx>=0){ cur = idx; document.getElementById("cur").textContent = idx+1; }
    }
  });
},{threshold:.55});
document.querySelectorAll(".slide").forEach(s=>io.observe(s));
</script>
