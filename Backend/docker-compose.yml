services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - neuremia_postgres:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEUREMIA_SECRET_KEY: ${NEUREMIA_SECRET_KEY:?NEUREMIA_SECRET_KEY is required}
      NEUREMIA_FIELD_ENCRYPTION_KEY: ${NEUREMIA_FIELD_ENCRYPTION_KEY:?NEUREMIA_FIELD_ENCRYPTION_KEY is required}
      NEUREMIA_ADMIN_API_KEY: ${NEUREMIA_ADMIN_API_KEY:?NEUREMIA_ADMIN_API_KEY is required}
      NEUREMIA_ENV: ${NEUREMIA_ENV:-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      PUSH_WEBHOOK_URL: ${PUSH_WEBHOOK_URL:-}
    ports:
      - "8000:8000"

volumes:
  neuremia_postgres:
